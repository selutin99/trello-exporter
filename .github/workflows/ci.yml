name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# YAML aliases keep action pins in one place; uses does not accept env expressions.
env:
  ACTION_CHECKOUT: &checkout actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
  ACTION_SETUP_NODE: &setup_node actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
  ACTION_UPLOAD_ARTIFACT: &upload_artifact actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
  NODE_VERSION: '24'
  GITLEAKS_VERSION: '8.30.1'
  GITLEAKS_LINUX_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  secrets:
    name: Secrets / Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: *checkout
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan all Git history
        shell: bash
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --location --retry 3 --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "$GITLEAKS_LINUX_SHA256  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact=100 --no-banner --log-opts=--all .

  quality:
    name: Types, lint, smells, coverage and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: *checkout
        with:
          persist-credentials: false
      - uses: *setup_node
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Check TypeScript
        run: npm run typecheck
      - name: Lint TypeScript and CSS
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: Check code smells
        run: npm run lint:smells
      - name: Test with coverage thresholds
        run: npm run test:coverage
      - name: Build without publishing
        run: npm run build
      - name: Save checked Power-Up site for CD
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: *upload_artifact
        with:
          name: power-up-site
          path: dist/
          retention-days: 7
          if-no-files-found: error
      - name: Save coverage report
        if: always()
        uses: *upload_artifact
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore
