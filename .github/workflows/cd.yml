name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions: {}

concurrency:
  group: github-pages
  cancel-in-progress: false

# Publish the artifact from the successful CI run, never a newer checkout.
env:
  ACTION_DOWNLOAD_ARTIFACT: &download_artifact actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
  ACTION_UPLOAD_PAGES_ARTIFACT: &upload_pages_artifact actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
  ACTION_DEPLOY_PAGES: &deploy_pages actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

jobs:
  prepare:
    name: Prepare the site checked by CI
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - name: Download the checked Power-Up site
        uses: *download_artifact
        with:
          name: power-up-site
          path: site/
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Package the Pages artifact
        uses: *upload_pages_artifact
        with:
          path: site/

  deploy:
    name: Deploy Power-Up to GitHub Pages
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the checked site
        id: deployment
        uses: *deploy_pages
