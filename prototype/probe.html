<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Board Snapshot Exporter · Compatibility probe</title>
  <link rel="stylesheet" href="./probe.css">
  <script src="https://p.trellocdn.com/power-up.min.js" defer></script>
  <script src="./probe.js?v=3" type="module"></script>
</head>
<body>
  <main>
    <header>
      <div><p class="badge" data-i18n="badge"></p><h1 data-i18n="title"></h1></div>
      <div><label for="language" data-i18n="language"></label>
        <select id="language"><option value="ru">Русский</option><option value="en">English</option></select>
      </div>
    </header>
    <p data-i18n="intro"></p>
    <p class="scope"><span data-i18n="scope"></span>: <code id="scope"></code></p>
    <section aria-labelledby="files-title">
      <h2 id="files-title" data-i18n="filesTitle"></h2>
      <button id="download" data-i18n="download"></button>
      <label class="file-label"><span data-i18n="choose"></span><input id="file" type="file"></label>
      <p class="note" data-i18n="fileNote"></p>
      <button id="scan" data-i18n="scan" disabled></button>
    </section>
    <section aria-labelledby="api-title">
      <h2 id="api-title" data-i18n="apiTitle"></h2>
      <p class="note" data-i18n="accessNote"></p>
      <p id="standalone" class="note" data-i18n="standalone" hidden></p>
      <button id="connect" data-i18n="connect" disabled></button>
      <button id="inspect" data-i18n="inspect" disabled></button>
      <p><a href="https://id.atlassian.com/manage-profile/apps" target="_blank" rel="noopener noreferrer" data-i18n="manageAccess"></a></p>
    </section>
    <div class="toolbar">
      <p id="status" role="status" aria-live="polite"></p>
      <button id="cancel" data-i18n="cancel" disabled></button>
    </div>
    <h2 data-i18n="results"></h2>
    <pre id="results" tabindex="0"></pre>
    <button id="report" data-i18n="report"></button>
    <p><a href="./privacy.html" target="_blank" rel="noopener noreferrer" data-i18n="privacy"></a></p>
  </main>
</body>
</html>
